<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>추첨 결과</title><style>
body{margin:0;background:#f7f3ee;color:#2f2a26;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:680px;margin:0 auto;padding:40px 18px}.card{background:#fff;border-radius:22px;padding:30px;box-shadow:0 8px 30px rgba(0,0,0,.06);text-align:center}h1{font-size:25px;margin:0 0 14px}p{line-height:1.7;color:#6f655d}.btn{display:inline-block;margin-top:12px;padding:13px 18px;border-radius:12px;background:#5f493d;color:#fff;text-decoration:none;font-weight:800}.notice{padding:14px;border-radius:14px;background:#f6efe8;color:#6f655d;margin-top:14px}
</style><script>document.write('<script src="resident-event-config.js?v='+Date.now()+'"><\/script>')</script><script>document.write('<script src="resident-event-api.js?v='+Date.now()+'"><\/script>')</script></head><body><main class="wrap"><section class="card"><h1 id="title">추첨 결과</h1><div id="content"><p>결과를 확인하는 중입니다.</p></div><a class="btn" href="resident-event-user.html">이벤트 페이지로 돌아가기</a></section></main><script>
(function(){
 const C=Object.assign({eventId:'movie-ticket-202608',eventTitle:'입실자 이벤트'},window.STAY_EVENT_PUBLIC_CONFIG||{});
 document.getElementById('title').textContent=(C.eventTitle||'입실자 이벤트')+' 추첨 결과';
 const box=document.getElementById('content');
 if(!window.StayEventApi||!StayEventApi.configured()){box.innerHTML='<div class="notice">추첨 결과 서버에 연결할 수 없습니다.</div>';return;}
 StayEventApi.getResult(C.eventId||'movie-ticket-202608').then(function(data){
   if(data.resultUrl){ location.replace(data.resultUrl); return; }
   box.innerHTML='<p><b>현재 공개된 추첨 결과가 없습니다.</b><br>새 이벤트를 시작하면서 응모 초기화를 하면 이전 추첨 결과도 함께 삭제됩니다.</p>';
 }).catch(function(err){box.innerHTML='<div class="notice">결과 확인 실패: '+String(err.message||err)+'</div>';});
})();
</script></body></html>

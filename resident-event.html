<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>입실자 이벤트 | 스테이The머무름</title><meta name="robots" content="noindex,nofollow"><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",Arial,sans-serif;background:#f7f3ee;color:#28231f}.wrap{max-width:820px;margin:auto;padding:24px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top a{color:#5b5149;text-decoration:none}.card{background:#fff;border-radius:22px;padding:26px;box-shadow:0 8px 28px #00000010;margin-bottom:16px}.eyebrow{font-size:13px;font-weight:800;color:#8b6c52}.hero{text-align:center;background:linear-gradient(145deg,#fff,#f4e9dc)}h1{font-size:29px;margin:8px 0}.gift{font-size:62px;margin:10px}.desc{color:#6b625b;line-height:1.65}.fields{display:grid;grid-template-columns:1fr;gap:10px;margin:18px 0}input,button{width:100%;border-radius:13px;padding:14px;font-size:16px}input{border:1px solid #d9d0c7;background:#fff}button{border:0;background:#3b3028;color:#fff;font-weight:800;cursor:pointer}.notice{font-size:13px;color:#766c64;line-height:1.6}.test{display:inline-block;margin-top:4px;padding:5px 9px;border-radius:999px;background:#f1e9df;color:#725d4b;font-size:12px;font-weight:800}.bad{padding:14px;border-radius:13px;background:#fff0ee;color:#8b3b32;margin-top:12px}.ticket{border:2px dashed #c8a27c;border-radius:18px;padding:20px;margin:18px 0;background:#fffaf4}.ticket strong{font-size:22px}.countdown{font-size:18px;font-weight:900;margin:12px 0;color:#815f43}@media(max-width:560px){.card{padding:20px}h1{font-size:25px}}
</style></head><body><main class="wrap"><div class="top"><b>스테이The머무름</b><a href="index.html">메인으로</a></div><section class="card hero"><div class="eyebrow">입실자 전용 EVENT</div><div class="gift">🎬</div><h1>영화관람권 2명 이벤트</h1><p class="desc">입실자 전용 이벤트입니다.<br>공지받은 비밀번호와 본인 정보를 입력해 주세요.</p><div class="ticket"><strong>영화관람권 1매씩</strong><br><span>당첨 인원 2명</span><div id="countdown" class="countdown">마감시간 확인 중...</div></div><div class="fields"><input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="입실자 비밀번호"><input id="room" inputmode="numeric" autocomplete="off" placeholder="방번호 (예: 305)"><input id="name" autocomplete="name" placeholder="이름"></div><button id="enter">입장하기</button><div id="msg"></div></section></main><script>
(function(){const RESIDENT_PASS='2026',MASTER_PASS='0616',PREFIX='stayResidentEvent:movie-ticket-202608:';const $=id=>document.getElementById(id);function config(){try{return JSON.parse(localStorage.getItem(PREFIX+'config'))||{start:'2026-08-26T00:00',end:'2026-08-31T20:00',closed:false}}catch(e){return {start:'2026-08-26T00:00',end:'2026-08-31T20:00',closed:false}}}function fmt(v){return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'long',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(v))}function countdown(){const c=config(),n=new Date(),s=new Date(c.start),e=new Date(c.end),el=$('countdown');if(c.closed||n>e){el.textContent='응모 마감';return}if(n<s){el.textContent='응모 시작: '+fmt(c.start);return}const d=e-n,dd=Math.floor(d/86400000),h=Math.floor(d%86400000/3600000),m=Math.floor(d%3600000/60000);el.textContent='마감까지 '+(dd?dd+'일 ':'')+h+'시간 '+m+'분'}$('enter').onclick=function(){const p=$('pw').value.trim(),r=$('room').value.trim(),n=$('name').value.trim();$('msg').innerHTML='';if(p===MASTER_PASS){sessionStorage.setItem('stayEventAdmin','1');location.href='resident-event-admin.html';return}if(p!==RESIDENT_PASS){$('msg').innerHTML='<div class="bad">비밀번호가 맞지 않습니다.</div>';return}if(!/^\d{2,4}$/.test(r)){$('msg').innerHTML='<div class="bad">방번호를 숫자로 입력해 주세요.</div>';return}if(n.length<2){$('msg').innerHTML='<div class="bad">이름을 입력해 주세요.</div>';return}const DEVICE_KEY=PREFIX+'deviceIdentity';let saved=null;try{saved=JSON.parse(localStorage.getItem(DEVICE_KEY)||'null')}catch(e){}if(saved&&saved.room!==r){$('msg').innerHTML='<div class="bad">이 기기는 이미 '+saved.room+'호 입실자용으로 등록되어 있습니다. 같은 기기에서 다른 호실로는 응모할 수 없습니다.</div>';return}if(saved&&saved.name&&saved.name!==n){$('msg').innerHTML='<div class="bad">이 기기는 이미 '+saved.room+'호 '+saved.name+'님으로 등록되어 있습니다. 등록된 정보로만 참여할 수 있습니다.</div>';return}if(!saved){localStorage.setItem(DEVICE_KEY,JSON.stringify({room:r,name:n,registeredAt:new Date().toISOString()}))}sessionStorage.setItem('stayEventRoom',r);sessionStorage.setItem('stayEventName',n);location.href='resident-event-user.html'};countdown();setInterval(countdown,60000)})();
</script></body></html>

(function(){const RESIDENT_PASS='2026',MASTER_PASS='0616',PREFIX='stayResidentEvent:'+((window.STAY_EVENT_PUBLIC_CONFIG||{}).eventId||'unknown')+':';const $=id=>document.getElementById(id);const C=Object.assign({active:false,eventTitle:'입실자 이벤트',prizeLabel:'이벤트 상품',prizeCount:2,start:'',end:'',activeMessage:'현재 이벤트가 진행 중입니다.',inactiveMessage:'현재 진행 중인 입실자 이벤트가 없습니다.',closedMessage:'응모가 마감되었습니다.',resultFile:'resident-event-result.html'},window.STAY_EVENT_PUBLIC_CONFIG||{});$('title').textContent=C.eventTitle;$('prize').textContent=C.prizeLabel;$('count').textContent='당첨 인원 '+C.prizeCount+'명';function fmt(v){return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'long',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(v))}function state(){const status=C.status||(C.active?'active':'inactive');if(status==='preparing')return 'preparing';if(status==='testing')return 'testing';const n=new Date(),s=C.start?new Date(C.start):null,e=C.end?new Date(C.end):null;if(status!=='active')return 'inactive';if(s&&n<s)return 'before';if(e&&n>e)return 'closed';return 'open'}function render(){const st=state(),msg=$('publicMessage'),cd=$('countdown'),area=$('loginArea');if(st==='preparing'){msg.textContent='이벤트 준비 중입니다.';cd.textContent='';area.style.display='none'}else if(st==='testing'){msg.textContent='이벤트 테스트 중입니다. 테스트 응모가 가능합니다.';cd.textContent='테스트 모드';area.style.display='block'}else if(st==='inactive'){msg.textContent=C.inactiveMessage;cd.textContent='';area.style.display='none'}else if(st==='before'){msg.textContent=C.activeMessage;cd.textContent='응모 시작: '+fmt(C.start);area.style.display='none'}else if(st==='closed'){msg.textContent=C.closedMessage;cd.textContent='응모 마감';area.style.display='none'}else{msg.textContent=C.activeMessage;area.style.display='block';const d=new Date(C.end)-new Date(),dd=Math.floor(d/86400000),h=Math.floor(d%86400000/3600000),m=Math.floor(d%3600000/60000);cd.textContent='마감까지 '+(dd?dd+'일 ':'')+h+'시간 '+m+'분'}}if(window.STAY_EVENT_CONFIG_UNAVAILABLE){$('publicCountValue').textContent='서버 설정 확인 필요';$('refreshCount').disabled=true;$('verifyMine').disabled=true;$('viewResult').disabled=true;}$('viewResult').onclick=()=>location.href=(C.resultFile||'resident-event-result.html')+'?v='+Date.now();$('directorEnter').onclick=function(){const p=prompt('원장님 마스터 비밀번호를 입력해 주세요.');if(p===null)return;if(p.trim()===MASTER_PASS){sessionStorage.setItem('stayEventAdmin','1');location.href='resident-event-admin.html';return}alert('마스터 비밀번호가 맞지 않습니다.')} ;$('enter').onclick=function(){const p=$('pw').value.trim(),n=$('name').value.trim(),r=$('room').value.trim();$('msg').innerHTML='';if(p===MASTER_PASS){sessionStorage.setItem('stayEventAdmin','1');location.href='resident-event-admin.html';return}if(!['open','testing'].includes(state())){$('msg').innerHTML='<div class="bad">현재는 응모 가능한 시간이 아닙니다.</div>';return}if(p!==RESIDENT_PASS){$('msg').innerHTML='<div class="bad">비밀번호가 맞지 않습니다.</div>';return}if(!n||n.length<2||n.length>12){$('msg').innerHTML='<div class="bad">이름을 정확히 입력해 주세요.</div>';return}if(!/^\d{2,4}$/.test(r)){$('msg').innerHTML='<div class="bad">방번호를 숫자로 입력해 주세요.</div>';return}const DEVICE_KEY=PREFIX+'deviceIdentity';let saved=null;try{saved=JSON.parse(localStorage.getItem(DEVICE_KEY)||'null')}catch(e){}if(saved&&saved.room!==r){$('msg').innerHTML='<div class="bad">이 기기는 이미 '+saved.room+'호 입실자용으로 등록되어 있습니다.</div>';return}if(saved&&saved.name&&saved.name!==n){$('msg').innerHTML='<div class="bad">이 기기는 이미 '+saved.name+'님 · '+saved.room+'호로 등록되어 있습니다.</div>';return}if(!saved||!saved.name)localStorage.setItem(DEVICE_KEY,JSON.stringify({room:r,name:n,registeredAt:(saved&&saved.registeredAt)||new Date().toISOString()}));sessionStorage.setItem('stayEventRoom',r);sessionStorage.setItem('stayEventName',n);location.href='resident-event-user.html'};async function updateCount(){if(window.STAY_EVENT_CONFIG_UNAVAILABLE)return;try{const x=await StayEventApi.count(C.eventId);$('publicCountValue').textContent=x.total+'명'}catch(e){$('publicCountValue').textContent='조회 실패 · 다시 시도해 주세요'}}$('refreshCount').onclick=updateCount;$('verifyMine').onclick=async function(){if(window.STAY_EVENT_CONFIG_UNAVAILABLE)return;const b=this,out=$('verifyMessage');b.disabled=true;out.textContent='서버 확인 중...';try{const x=await StayEventApi.verifyMine(C.eventId,$('verifyRoom').value.trim(),$('verifyName').value.trim(),$('verifyPass').value.trim());if(x.verified){const t=x.participant;out.textContent='✅ 서버 접수 확인 · '+t.room+'호 · '+t.name+' · 접수번호 '+t.receiptId+' · 접수시각 '+new Date(t.createdAt).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'});}else out.textContent='입력 정보와 일치하는 서버 응모 기록이 없습니다.'}catch(e){out.textContent='조회 실패: 입력 정보나 서버 연결을 확인해 주세요.'}finally{b.disabled=false}};render();updateCount();setInterval(function(){render();updateCount()},60000)})();

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>입실자 이벤트 | 스테이The머무름</title><meta name="robots" content="noindex,nofollow"><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",Arial,sans-serif;background:#f7f3ee;color:#28231f}.wrap{max-width:820px;margin:auto;padding:24px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top a{color:#5b5149;text-decoration:none}.card{background:#fff;border-radius:22px;padding:26px;box-shadow:0 8px 28px #00000010;margin-bottom:16px}.eyebrow{font-size:13px;font-weight:800;color:#8b6c52}.hero{text-align:center;background:linear-gradient(145deg,#fff,#f4e9dc)}h1{font-size:29px;margin:8px 0}.gift{font-size:62px;margin:10px}.desc{color:#6b625b;line-height:1.65}.fields{display:grid;grid-template-columns:1fr;gap:10px;margin:18px 0}input,button{width:100%;border-radius:13px;padding:14px;font-size:16px}input{border:1px solid #d9d0c7;background:#fff}button{border:0;background:#3b3028;color:#fff;font-weight:800;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.bad,.status{padding:14px;border-radius:13px;margin-top:12px}.bad{background:#fff0ee;color:#8b3b32}.status{background:#fff4df;color:#6d4c25;font-weight:800;line-height:1.6}.ticket{border:2px dashed #c8a27c;border-radius:18px;padding:20px;margin:18px 0;background:#fffaf4}.ticket strong{font-size:22px}.countdown{font-size:18px;font-weight:900;margin:12px 0;color:#815f43}.result{margin-top:10px;background:#7a5a3e}@media(max-width:560px){.card{padding:20px}h1{font-size:25px}}
</style><script>document.write('<script src="resident-event-config.js?v='+Date.now()+'"><\/script>')</script></head><body><main class="wrap"><div class="top"><b>스테이The머무름</b><a href="index.html">메인으로</a></div><section class="card hero"><div class="eyebrow">입실자 전용 EVENT</div><div class="gift">🎁</div><h1 id="title">입실자 이벤트</h1><p id="publicMessage" class="status"></p><div class="ticket"><strong id="prize">이벤트 상품</strong><br><span id="count"></span><div id="countdown" class="countdown"></div></div><div id="loginArea"><p class="desc">공지받은 비밀번호와 본인 이름, 방번호를 입력해 주세요.</p><div class="fields"><input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="입실자 비밀번호"><input id="name" autocomplete="name" maxlength="12" placeholder="이름 (예: 홍길동)"><input id="room" inputmode="numeric" autocomplete="off" placeholder="방번호 (예: 305)"></div><button id="enter">입장하기</button></div><button id="viewResult" class="result">🎉 추첨 결과 보기</button><button id="directorEnter" style="margin-top:10px;background:#4b5563">원장님 모드</button><div id="msg"></div></section></main><script>
(function(){const RESIDENT_PASS='2026',MASTER_PASS='0616',PREFIX='stayResidentEvent:movie-ticket-202608:';const $=id=>document.getElementById(id);const C=Object.assign({active:false,eventTitle:'입실자 이벤트',prizeLabel:'이벤트 상품',prizeCount:2,start:'',end:'',activeMessage:'현재 이벤트가 진행 중입니다.',inactiveMessage:'현재 진행 중인 입실자 이벤트가 없습니다.',closedMessage:'응모가 마감되었습니다.',resultFile:'resident-event-result.html'},window.STAY_EVENT_PUBLIC_CONFIG||{});$('title').textContent=C.eventTitle;$('prize').textContent=C.prizeLabel;$('count').textContent='당첨 인원 '+C.prizeCount+'명';function fmt(v){return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'long',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(v))}function state(){const status=C.status||(C.active?'active':'inactive');if(status==='preparing')return 'preparing';if(status==='testing')return 'testing';const n=new Date(),s=C.start?new Date(C.start):null,e=C.end?new Date(C.end):null;if(status!=='active')return 'inactive';if(s&&n<s)return 'before';if(e&&n>e)return 'closed';return 'open'}function render(){const st=state(),msg=$('publicMessage'),cd=$('countdown'),area=$('loginArea');if(st==='preparing'){msg.textContent='이벤트 준비 중입니다.';cd.textContent='';area.style.display='none'}else if(st==='testing'){msg.textContent='이벤트 테스트 중입니다. 테스트 응모가 가능합니다.';cd.textContent='테스트 모드';area.style.display='block'}else if(st==='inactive'){msg.textContent=C.inactiveMessage;cd.textContent='';area.style.display='none'}else if(st==='before'){msg.textContent=C.activeMessage;cd.textContent='응모 시작: '+fmt(C.start);area.style.display='none'}else if(st==='closed'){msg.textContent=C.closedMessage;cd.textContent='응모 마감';area.style.display='none'}else{msg.textContent=C.activeMessage;area.style.display='block';const d=new Date(C.end)-new Date(),dd=Math.floor(d/86400000),h=Math.floor(d%86400000/3600000),m=Math.floor(d%3600000/60000);cd.textContent='마감까지 '+(dd?dd+'일 ':'')+h+'시간 '+m+'분'}}$('viewResult').onclick=()=>location.href=(C.resultFile||'resident-event-result.html')+'?v='+Date.now();$('directorEnter').onclick=function(){const p=prompt('원장님 마스터 비밀번호를 입력해 주세요.');if(p===null)return;if(p.trim()===MASTER_PASS){sessionStorage.setItem('stayEventAdmin','1');location.href='resident-event-admin.html';return}alert('마스터 비밀번호가 맞지 않습니다.')} ;$('enter').onclick=function(){const p=$('pw').value.trim(),n=$('name').value.trim(),r=$('room').value.trim();$('msg').innerHTML='';if(p===MASTER_PASS){sessionStorage.setItem('stayEventAdmin','1');location.href='resident-event-admin.html';return}if(!['open','testing'].includes(state())){$('msg').innerHTML='<div class="bad">현재는 응모 가능한 시간이 아닙니다.</div>';return}if(p!==RESIDENT_PASS){$('msg').innerHTML='<div class="bad">비밀번호가 맞지 않습니다.</div>';return}if(!n||n.length<2||n.length>12){$('msg').innerHTML='<div class="bad">이름을 정확히 입력해 주세요.</div>';return}if(!/^\d{2,4}$/.test(r)){$('msg').innerHTML='<div class="bad">방번호를 숫자로 입력해 주세요.</div>';return}const DEVICE_KEY=PREFIX+'deviceIdentity';let saved=null;try{saved=JSON.parse(localStorage.getItem(DEVICE_KEY)||'null')}catch(e){}if(saved&&saved.room!==r){$('msg').innerHTML='<div class="bad">이 기기는 이미 '+saved.room+'호 입실자용으로 등록되어 있습니다.</div>';return}if(saved&&saved.name&&saved.name!==n){$('msg').innerHTML='<div class="bad">이 기기는 이미 '+saved.name+'님 · '+saved.room+'호로 등록되어 있습니다.</div>';return}if(!saved||!saved.name)localStorage.setItem(DEVICE_KEY,JSON.stringify({room:r,name:n,registeredAt:(saved&&saved.registeredAt)||new Date().toISOString()}));sessionStorage.setItem('stayEventRoom',r);sessionStorage.setItem('stayEventName',n);location.href='resident-event-user.html'};render();setInterval(render,60000)})();
</script></body></html>

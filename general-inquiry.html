<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>입주 문의 | 스테이The머무름</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f5f0;color:#2f332d;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;line-height:1.65}main{max-width:760px;margin:24px auto 64px;padding:0 16px}.hero{border-radius:20px;padding:30px 20px;background:linear-gradient(135deg,#2f3b2f,#65745d);color:white;text-align:center}.hero h1{margin:0;font-size:26px}.panel{margin-top:18px;background:white;border:1px solid #e4e6df;border-radius:16px;padding:22px}h2{font-size:20px;margin:0 0 12px}label{display:block;font-weight:700;margin:14px 0 6px}input,select,textarea{width:100%;padding:12px;font:inherit;font-size:16px;border:1px solid #bdc9bc;border-radius:9px;background:white}textarea{resize:vertical}button,.link-button{display:inline-flex;justify-content:center;align-items:center;padding:13px 17px;border:0;border-radius:9px;background:#315f43;color:white;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}.secondary{background:#e9f0e8;color:#315f43}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.actions>*{flex:1;min-width:170px}.note{background:#f1f5ed;padding:13px;border-radius:10px;font-size:14px}.muted{font-size:14px;color:#606d60}#status{min-height:1.5em;color:#315f43;font-weight:700}@media(max-width:600px){main{margin-top:10px}.panel{padding:18px}.actions>*{min-width:100%}}</style></head><body><main><header class="hero"><h1>입주 문의</h1><p>스테이The머무름에 궁금한 점을 남겨 주세요.</p></header><section class="panel"><p class="note">입주 제한 확인을 위해 이름·나이·준비하는 시험 등을 작성해 주세요. 이 양식은 <strong>일반 문의용</strong>이며 예약 신청이나 예약 확정 절차가 아닙니다.</p><form id="form"><label for="name">이름 *</label><input id="name" required maxlength="40" autocomplete="name"><label for="age">나이 *</label><input id="age" required type="number" min="1" max="120" inputmode="numeric"><label for="exam">준비하는 시험 *</label><input id="exam" required maxlength="100" placeholder="예: 교원임용, 공무원 시험 등"><label for="period">희망 입주기간 * <span class="muted" style="font-weight:400">(공실현황을 참고해 주세요)</span></label><input id="period" required maxlength="80" placeholder="예: 11월 중순부터 3개월 / 미정"><label for="room">희망 객실 (선택)</label><select id="room"><option value="">미정</option><option>스탠다드룸</option><option>디럭스룸</option><option>스위트1</option><option>스위트2</option></select><label for="question">문의 내용 (선택)</label><textarea id="question" rows="4" maxlength="800" placeholder="궁금한 내용을 작성해 주세요"></textarea><p class="note">문자 앱이 열리면 내용을 확인하고 <strong>전송 버튼을 반드시 눌러 주세요.</strong> 문자 앱을 여는 것만으로는 접수되지 않습니다. 원장의 회신으로 접수 여부를 확인해 주세요. 회신을 받지 못하면 전화 또는 카카오톡으로 다시 문의해 주세요.</p><div class="actions"><button type="submit">일반 문의 문자 보내기</button></div></form></section><section class="panel"><a href="availability.html">공실현황 확인하기</a></section></main><script>
const $=id=>document.getElementById(id);$('form').addEventListener('submit',e=>{e.preventDefault();if(!$('form').reportValidity())return;const v=id=>$(id).value.trim();const lines=['[스테이The머무름 입주 문의]','이름: '+v('name'),'나이: '+v('age'),'준비하는 시험: '+v('exam'),'희망 입주기간: '+v('period')];if(v('room'))lines.push('희망 객실: '+v('room'));if(v('question'))lines.push('문의 내용: '+v('question'));const ios=/iPad|iPhone|iPod/.test(navigator.userAgent);location.href='sms:01028779447'+(ios?'&':'?')+'body='+encodeURIComponent(lines.join('\n'));});
</script></body></html>

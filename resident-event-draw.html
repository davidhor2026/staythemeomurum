<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공개 사다리 추첨 | 스테이The머무름</title><meta name="robots" content="noindex,nofollow"><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",Arial,sans-serif;background:#f7f3ee;color:#28231f}.wrap{max-width:1080px;margin:auto;padding:24px 14px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top a{color:#5b5149;text-decoration:none}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #00000010;margin-bottom:16px}.hero{text-align:center;background:linear-gradient(145deg,#fff,#f4e9dc)}h1{font-size:29px;margin:8px 0}.desc{color:#6b625b;line-height:1.65}.test{display:inline-block;padding:5px 9px;border-radius:999px;background:#f1e9df;color:#725d4b;font-size:12px;font-weight:800}.meta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0}.pill{padding:8px 11px;border-radius:999px;background:#f1e9df;font-size:13px;font-weight:800}.board-wrap{overflow-x:auto;padding:8px 0}.board{position:relative;margin:0 auto;min-height:520px}.labels{position:absolute;left:0;right:0;display:flex;justify-content:space-between}.labels.top{top:0}.labels.bottom{bottom:0}.label{width:86px;text-align:center;font-size:12px;font-weight:800;padding:6px 4px}.label .room{display:block;font-size:14px}.label.prize{color:#9a5a12}.ladder{position:absolute;top:64px;bottom:64px;left:43px;right:43px}.vline,.hline{position:absolute;background:#c9b9aa;border-radius:5px}.vline{top:0;bottom:0;width:3px}.hline{height:3px}.path{position:absolute;inset:0;pointer-events:none}.seg{position:absolute;background:#d45b4e;border-radius:5px;box-shadow:0 0 0 1px #fff}.seg.v{width:5px}.seg.h{height:5px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}button{width:100%;border-radius:13px;padding:14px;font-size:16px;border:0;background:#3b3028;color:#fff;font-weight:800;cursor:pointer}.secondary{background:#eee7e0;color:#3b3028}.winner{font-size:22px;font-weight:900;text-align:center;padding:18px;border:2px solid #d4b18b;border-radius:18px;background:#fff8ef;margin-top:14px}.notice{font-size:13px;color:#766c64;line-height:1.65}.bad{padding:14px;border-radius:13px;background:#fff0ee;color:#8b3b32;margin-top:12px}@media(max-width:560px){.card{padding:18px}h1{font-size:24px}.controls{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="top"><b>스테이The머무름</b><a href="resident-event.html">이벤트 페이지</a></div><section class="card hero"><span class="test">현재는 테스트 화면입니다</span><h1>🪜 공개 사다리 추첨</h1><p class="desc">응모 마감 시점의 참가자 명단과 무작위 시드로 사다리를 고정했습니다.<br>이 링크를 다시 열어도 같은 사다리와 같은 당첨 결과가 재현됩니다.</p><div id="meta" class="meta"></div></section><section class="card"><div id="error"></div><div id="boardWrap" class="board-wrap"><div id="board" class="board"></div></div><div class="controls"><button id="play">전체 경로 공개하기</button><button id="reset" class="secondary">처음부터 다시 보기</button></div><div id="winnerBox"></div><p class="notice">※ 공개 추첨 링크 안에는 추첨 당시 참가자 목록, 추첨 시각, 무작위 시드가 함께 고정됩니다. 따라서 결과를 나중에 바꾸면 링크 내용도 달라집니다.</p></section></main><script>
(function(){const $=id=>document.getElementById(id);function b64ToStr(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)))}function mask(n){if(!n)return '';return n.length===1?n:n[0]+'○'.repeat(Math.max(1,n.length-1))}let data;try{const d=new URLSearchParams(location.search).get('d');data=JSON.parse(b64ToStr(d||''));if(!data.participants||data.participants.length<2)throw 0}catch(e){$('error').innerHTML='<div class="bad">유효한 공개 추첨 정보가 없습니다.</div>';$('play').disabled=true;$('reset').disabled=true;return}function hashSeed(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}let state=hashSeed(data.seed);function rnd(){state+=0x6D2B79F5;let t=state;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}const n=data.participants.length,rows=Math.max(9,Math.min(18,n+7));const rungs=[];for(let r=0;r<rows;r++){let usedPrev=false;for(let c=0;c<n-1;c++){if(!usedPrev&&rnd()<0.38){rungs.push({r,c});usedPrev=true}else usedPrev=false}}if(rungs.length===0&&n>1)rungs.push({r:Math.floor(rows/2),c:0});const prizeSlots=[];while(prizeSlots.length<Math.min(data.prizeCount||2,n)){const x=Math.floor(rnd()*n);if(!prizeSlots.includes(x))prizeSlots.push(x)}function endpoint(start){let c=start;for(let r=0;r<rows;r++){if(rungs.some(x=>x.r===r&&x.c===c))c++;else if(rungs.some(x=>x.r===r&&x.c===c-1))c--}return c}const winners=[];for(let i=0;i<n;i++){if(prizeSlots.includes(endpoint(i)))winners.push(data.participants[i])}$('meta').innerHTML='<span class="pill">참가 '+n+'명</span><span class="pill">당첨 '+Math.min(data.prizeCount||2,n)+'명</span><span class="pill">추첨 '+new Date(data.createdAt).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})+'</span><span class="pill">시드 '+data.seed.slice(0,12)+'…</span>';const board=$('board'),colW=Math.max(86,Math.min(115,760/n)),w=Math.max(520,n*colW),h=520;board.style.width=w+'px';board.style.height=h+'px';const top=document.createElement('div');top.className='labels top';const bottom=document.createElement('div');bottom.className='labels bottom';data.participants.forEach(p=>{const d=document.createElement('div');d.className='label';d.style.width=colW+'px';d.innerHTML='<span class="room">'+p.room+'호</span>'+mask(p.name);top.appendChild(d)});for(let i=0;i<n;i++){const d=document.createElement('div');d.className='label '+(prizeSlots.includes(i)?'prize':'');d.style.width=colW+'px';d.innerHTML=prizeSlots.includes(i)?'<span class="room">🎟️ 당첨</span>영화관람권':'<span class="room">꽝</span>다음 기회에';bottom.appendChild(d)}board.appendChild(top);board.appendChild(bottom);const ladder=document.createElement('div');ladder.className='ladder';board.appendChild(ladder);const innerW=w-86,innerH=h-128,xStep=innerW/(n-1||1),yStep=innerH/(rows+1);for(let c=0;c<n;c++){const v=document.createElement('div');v.className='vline';v.style.left=(c*xStep)+'px';ladder.appendChild(v)}rungs.forEach(x=>{const h=document.createElement('div');h.className='hline';h.style.left=(x.c*xStep)+'px';h.style.top=((x.r+1)*yStep)+'px';h.style.width=xStep+'px';ladder.appendChild(h)});const pathLayer=document.createElement('div');pathLayer.className='path';ladder.appendChild(pathLayer);function clearPaths(){pathLayer.innerHTML='';$('winnerBox').innerHTML=''}function drawPath(start,delay){const segs=[];let c=start,lastY=0;for(let r=0;r<rows;r++){const y=(r+1)*yStep;segs.push({t:'v',x:c*xStep,y:lastY,h:y-lastY});if(rungs.some(x=>x.r===r&&x.c===c)){segs.push({t:'h',x:c*xStep,y:y-2.5,w:xStep});c++}else if(rungs.some(x=>x.r===r&&x.c===c-1)){segs.push({t:'h',x:(c-1)*xStep,y:y-2.5,w:xStep});c--}lastY=y}segs.push({t:'v',x:c*xStep,y:lastY,h:innerH-lastY});let t=delay;segs.forEach(s=>{setTimeout(()=>{const e=document.createElement('div');e.className='seg '+s.t;e.style.left=s.x+'px';e.style.top=s.y+'px';if(s.t==='v')e.style.height=s.h+'px';else e.style.width=s.w+'px';pathLayer.appendChild(e)},t);t+=120});return t}function play(){clearPaths();$('play').disabled=true;let t=0;for(let i=0;i<n;i++)t=drawPath(i,t+80);setTimeout(()=>{$('winnerBox').innerHTML='<div class="winner">🎉 당첨을 축하합니다!<br>'+winners.map(x=>x.room+'호 '+mask(x.name)).join(' · ')+'</div>';$('play').disabled=false},t+200)}$('play').onclick=play;$('reset').onclick=function(){clearPaths();$('play').disabled=false};})();
</script></body></html>

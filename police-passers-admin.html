<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>경찰 합격자 명단 관리 | 스테이The머무름</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#17223b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}.wrap{max-width:720px;margin:0 auto;padding:28px 16px 60px}.card{background:#fff;border:1px solid #dfe5ef;border-radius:18px;padding:22px;box-shadow:0 8px 24px rgba(27,43,72,.08)}h1{margin:0 0 8px;font-size:24px}p{line-height:1.6}.muted{color:#667085;font-size:14px}.row{display:flex;gap:8px;margin:18px 0}.row input{flex:1;padding:13px 14px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}.btn-add{background:#0b3a74;color:#fff}.btn-download{width:100%;margin-top:18px;background:#b88718;color:#fff;font-size:16px}.list{display:flex;flex-direction:column;gap:8px;margin-top:12px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;border:1px solid #e4e7ec;border-radius:10px;background:#fafbfc}.name{font-weight:800;font-size:17px}.del{border:0;background:#fff0f0;color:#b42318;border-radius:8px;padding:7px 10px;font-weight:800;cursor:pointer}.preview{margin-top:22px;padding:16px;border-radius:12px;background:#082b69;color:#fff;text-align:center}.preview strong{display:block;color:#f4d26a;margin-bottom:8px}.previewNames{font-size:20px;font-weight:900;line-height:1.5}.steps{margin-top:20px;padding:14px 16px;background:#fff8e5;border-radius:12px;font-size:14px;line-height:1.7}.ok{margin-top:10px;color:#137333;font-weight:700;min-height:22px}@media(max-width:520px){.row{flex-direction:column}.btn-add{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>경찰 합격자 명단 관리</h1>
    <p class="muted">이 화면에서 이름을 추가·삭제한 뒤 <b>수정 파일 다운로드</b>를 누르세요. 홈페이지 소스 코드를 직접 편집할 필요가 없습니다.</p>
    <div class="row">
      <input id="nameInput" type="text" maxlength="12" placeholder="예: 조O서" autocomplete="off">
      <button class="btn btn-add" id="addBtn" type="button">명단 추가</button>
    </div>
    <div class="list" id="nameList"></div>
    <div class="preview">
      <strong>홈페이지 표시 미리보기</strong>
      <div class="previewNames" id="previewNames"></div>
    </div>
    <button class="btn btn-download" id="downloadBtn" type="button">수정 파일 police-passers.js 다운로드</button>
    <div class="ok" id="status"></div>
    <div class="steps"><b>사용 방법</b><br>1. 이름 추가 또는 삭제<br>2. 위의 ‘수정 파일 다운로드’ 클릭<br>3. GitHub의 홈페이지 폴더에 다운로드된 <b>police-passers.js</b>를 업로드하여 기존 파일을 덮어쓰기<br>4. 잠시 후 홈페이지 새로고침 — 명단이 자동 반영됩니다.</div>
  </div>
</div>
<script src="police-passers.js"></script>
<script>
(function(){
  var names=(window.STAY_POLICE_PASSERS&&Array.isArray(window.STAY_POLICE_PASSERS.names))?window.STAY_POLICE_PASSERS.names.slice():['박O영','장O보','이O름','조O서'];
  var list=document.getElementById('nameList'), input=document.getElementById('nameInput'), preview=document.getElementById('previewNames'), status=document.getElementById('status');
  function clean(v){return String(v||'').trim().replace(/\s+/g,'');}
  function render(){
    list.innerHTML='';
    names.forEach(function(n,i){
      var row=document.createElement('div');row.className='item';
      var span=document.createElement('span');span.className='name';span.textContent=n;
      var del=document.createElement('button');del.type='button';del.className='del';del.textContent='삭제';del.onclick=function(){names.splice(i,1);render();};
      row.appendChild(span);row.appendChild(del);list.appendChild(row);
    });
    preview.textContent=names.length?names.join(' · '):'명단 없음';
  }
  function add(){
    var n=clean(input.value);
    if(!n){status.textContent='추가할 이름을 입력해 주세요.';return;}
    if(names.indexOf(n)>=0){status.textContent='이미 명단에 있는 이름입니다.';return;}
    names.push(n);input.value='';status.textContent=n+' 님을 명단에 추가했습니다.';render();input.focus();
  }
  document.getElementById('addBtn').onclick=add;
  input.addEventListener('keydown',function(e){if(e.key==='Enter')add();});
  document.getElementById('downloadBtn').onclick=function(){
    var body='// 경찰 필기 합격자 명단\n// 이 파일만 GitHub에 덮어쓰면 홈페이지에 반영됩니다.\nwindow.STAY_POLICE_PASSERS = {\n  names: [\n'+names.map(function(n){return '    '+JSON.stringify(n);}).join(',\n')+'\n  ]\n};\n';
    var blob=new Blob([body],{type:'text/javascript;charset=utf-8'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='police-passers.js';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
    status.textContent='police-passers.js 파일을 다운로드했습니다. GitHub에 덮어쓰기 업로드하세요.';
  };
  render();
})();
</script>
</body>
</html>

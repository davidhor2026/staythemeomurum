<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>입실자 이벤트 관리자 | 스테이The머무름</title><meta name="robots" content="noindex,nofollow"><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",Arial,sans-serif;background:#f7f3ee;color:#28231f}.wrap{max-width:900px;margin:auto;padding:24px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top a{color:#5b5149;text-decoration:none}.card{background:#fff;border-radius:22px;padding:26px;box-shadow:0 8px 28px #00000010;margin-bottom:16px}h1{font-size:29px;margin:8px 0}h2{margin-top:0}.desc{color:#6b625b;line-height:1.65}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}input,button{width:100%;border-radius:13px;padding:14px;font-size:16px}input{border:1px solid #d9d0c7;background:#fff}button{border:0;background:#3b3028;color:#fff;font-weight:800;cursor:pointer}.secondary{background:#eee7e0;color:#3b3028}.danger{background:#8b3b32}.notice{font-size:13px;color:#766c64;line-height:1.6}.ok{padding:14px;border-radius:13px;background:#eef7ed;color:#315b31;margin-top:12px}.participant-list{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{padding:8px 11px;border-radius:999px;background:#f1e9df;font-weight:800}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:16px;border-radius:15px;background:#faf6f1}.stat b{display:block;font-size:26px;margin-top:4px}.small-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.test{display:inline-block;padding:5px 9px;border-radius:999px;background:#f1e9df;color:#725d4b;font-size:12px;font-weight:800}.preview{padding:16px;border-radius:16px;background:#faf6f1;margin-top:14px}.share{word-break:break-all;font-size:13px;background:#f5f1ec;padding:12px;border-radius:12px;margin-top:10px}@media(max-width:560px){.fields,.admin-grid,.small-actions{grid-template-columns:1fr}.card{padding:20px}h1{font-size:25px}}
</style></head><body><main class="wrap"><div class="top"><b>스테이The머무름</b><a href="resident-event.html" id="logout">관리자 종료</a></div><section class="card"><span class="test">현재는 테스트 화면입니다</span><h1>🔐 입실자 이벤트 관리자</h1><p class="desc">응모 현황과 마감시간을 관리하고, 마감 후 공개 사다리 추첨 링크를 생성합니다.</p><div class="admin-grid"><div class="stat">현재 응모 인원<b id="participantCount">0명</b></div><div class="stat">당첨 인원<b>2명</b></div></div><div class="fields"><label>응모 시작<input id="startAt" type="datetime-local"></label><label>응모 마감<input id="endAt" type="datetime-local"></label></div><button id="saveTime" class="secondary">응모 시간 저장</button><h3>응모자</h3><div id="participants" class="participant-list"></div><div class="fields"><input id="manualRoom" inputmode="numeric" placeholder="호실 수동 추가"><input id="manualName" placeholder="이름"></div><button id="addRoom" class="secondary">응모자 수동 추가</button><div class="small-actions"><button id="exportRooms" class="secondary">명단 복사</button><button id="closeEvent" class="secondary">지금 마감</button><button id="resetEvent" class="danger">응모 초기화</button></div></section><section class="card"><h2>🪜 공개 사다리 추첨</h2><p class="desc">마감 후 버튼을 누르면 현재 응모자 명단과 무작위 시드가 고정된 공개 추첨 링크가 만들어집니다. 누구든 같은 링크에서 동일한 사다리와 결과를 재생할 수 있습니다.</p><button id="makeDraw">공개 사다리 추첨 링크 만들기</button><div id="drawResult"></div></section></main><script>
(function(){if(sessionStorage.getItem('stayEventAdmin')!=='1'){location.replace('resident-event.html');return}const PREFIX='stayResidentEvent:movie-ticket-202608:';const DEF={start:'2026-08-26T00:00',end:'2026-08-31T20:00',closed:false};const $=id=>document.getElementById(id);$('logout').onclick=function(){sessionStorage.removeItem('stayEventAdmin')};function list(){try{const a=JSON.parse(localStorage.getItem(PREFIX+'participants')||'[]');return a.map(x=>typeof x==='string'?{room:x,name:''}:x)}catch(e){return []}}function setList(v){localStorage.setItem(PREFIX+'participants',JSON.stringify(v))}function cfg(){try{return JSON.parse(localStorage.getItem(PREFIX+'config'))||{...DEF}}catch(e){return {...DEF}}}function setCfg(v){localStorage.setItem(PREFIX+'config',JSON.stringify(v));render()}function mask(n){if(!n)return '';return n.length===1?n:n[0]+'○'.repeat(Math.max(1,n.length-1))}function render(){const a=list(),c=cfg();$('participantCount').textContent=a.length+'명';$('participants').innerHTML=a.length?a.map(x=>'<span class="chip">'+x.room+'호 '+mask(x.name)+'</span>').join(''):'<span class="notice">아직 응모자가 없습니다.</span>';$('startAt').value=c.start;$('endAt').value=c.end}$('saveTime').onclick=function(){const s=$('startAt').value,e=$('endAt').value;if(!s||!e||new Date(s)>=new Date(e)){alert('시작·마감 시간을 확인해 주세요.');return}setCfg({start:s,end:e,closed:false});alert('응모 시간이 저장되었습니다.')};$('addRoom').onclick=function(){const r=$('manualRoom').value.trim(),n=$('manualName').value.trim();if(!/^\d{2,4}$/.test(r)||n.length<2){alert('호실과 이름을 확인해 주세요.');return}let a=list();if(!a.some(x=>x.room===r)){a.push({room:r,name:n});setList(a)}$('manualRoom').value='';$('manualName').value='';render()};$('closeEvent').onclick=function(){const c=cfg();c.closed=true;setCfg(c);alert('응모를 마감했습니다.')};$('resetEvent').onclick=function(){if(confirm('응모자와 공개 추첨 정보를 모두 초기화할까요?')){localStorage.removeItem(PREFIX+'participants');localStorage.removeItem(PREFIX+'draw');const c=cfg();c.closed=false;setCfg(c);$('drawResult').innerHTML='';render()}};$('exportRooms').onclick=async function(){const t=list().map(x=>x.room+'호 '+x.name).join(', ');try{await navigator.clipboard.writeText(t||'응모자 없음');alert('응모 명단을 복사했습니다.')}catch(e){prompt('응모 명단',t)}};function bytesToB64(str){return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}function makeSeed(){if(window.crypto&&crypto.getRandomValues){const a=new Uint32Array(4);crypto.getRandomValues(a);return Array.from(a).map(x=>x.toString(16).padStart(8,'0')).join('')}return Date.now().toString(16)+Math.random().toString(16).slice(2)}$('makeDraw').onclick=function(){const a=list();if(a.length<2){alert('2명을 추첨하려면 응모자가 최소 2명 필요합니다.');return}const c=cfg();if(!c.closed&&new Date()<=new Date(c.end)){if(!confirm('아직 마감 전입니다. 지금 명단으로 공개 추첨 링크를 만들까요?'))return}const payload={event:'영화관람권 1매',prizeCount:2,participants:a,seed:makeSeed(),createdAt:new Date().toISOString()};localStorage.setItem(PREFIX+'draw',JSON.stringify(payload));const token=bytesToB64(JSON.stringify(payload));const url=new URL('resident-event-draw.html',location.href);url.searchParams.set('d',token);$('drawResult').innerHTML='<div class="ok">공개 추첨 링크가 생성되었습니다.</div><div class="share" id="shareUrl">'+url.href+'</div><button class="secondary" id="copyLink" style="margin-top:10px">공개 링크 복사</button><button id="openLink" style="margin-top:10px">공개 사다리 화면 열기</button>';$('copyLink').onclick=async()=>{try{await navigator.clipboard.writeText(url.href);alert('링크를 복사했습니다.')}catch(e){prompt('공개 추첨 링크',url.href)}};$('openLink').onclick=()=>window.open(url.href,'_blank')};render()})();
</script></body></html>

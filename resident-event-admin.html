<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>입실자 이벤트 관리자 | 스테이The머무름</title><meta name="robots" content="noindex,nofollow"><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",Arial,sans-serif;background:#f7f3ee;color:#28231f}.wrap{max-width:820px;margin:auto;padding:24px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top a{color:#5b5149;text-decoration:none}.card{background:#fff;border-radius:22px;padding:26px;box-shadow:0 8px 28px #00000010;margin-bottom:16px}.eyebrow{font-size:13px;font-weight:800;color:#8b6c52}.hero{text-align:center;background:linear-gradient(145deg,#fff,#f4e9dc)}h1{font-size:29px;margin:8px 0}h2{margin-top:0}.gift{font-size:62px;margin:10px}.desc{color:#6b625b;line-height:1.65}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.fields.one{grid-template-columns:1fr}input,select,button{width:100%;border-radius:13px;padding:14px;font-size:16px}input,select{border:1px solid #d9d0c7;background:#fff}button{border:0;background:#3b3028;color:#fff;font-weight:800;cursor:pointer}.secondary{background:#eee7e0;color:#3b3028}.danger{background:#8b3b32}.hidden{display:none!important}.notice{font-size:13px;color:#766c64;line-height:1.6}.ok{padding:14px;border-radius:13px;background:#eef7ed;color:#315b31;margin-top:12px}.bad{padding:14px;border-radius:13px;background:#fff0ee;color:#8b3b32;margin-top:12px}.info{padding:14px;border-radius:13px;background:#f3efe9;color:#65594f;margin-top:12px}.ticket{border:2px dashed #c8a27c;border-radius:18px;padding:20px;margin:18px 0;background:#fffaf4}.ticket strong{font-size:22px}.countdown{font-size:18px;font-weight:900;margin:12px 0;color:#815f43}.wheel-wrap{position:relative;width:min(360px,84vw);margin:24px auto}.pointer{position:absolute;z-index:4;top:-9px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid #3b3028}.wheel{width:100%;aspect-ratio:1;border-radius:50%;background:repeating-conic-gradient(#e7c7a5 0 24deg,#fff0dc 24deg 48deg);border:10px solid #fff;box-shadow:0 8px 25px #0002;display:grid;place-items:center;transition:transform 4.5s cubic-bezier(.12,.68,.08,1);position:relative;overflow:hidden}.wheel::after{content:"";width:38%;aspect-ratio:1;border-radius:50%;background:white;box-shadow:0 2px 10px #0002;position:absolute}.wheel span{z-index:2;font-weight:900;text-align:center;padding:12px;max-width:150px}.participant-list{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{padding:8px 11px;border-radius:999px;background:#f1e9df;font-weight:800}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:16px;border-radius:15px;background:#faf6f1}.stat b{display:block;font-size:26px;margin-top:4px}.winner{font-size:25px;font-weight:900;text-align:center;padding:20px;border:2px solid #d4b18b;border-radius:18px;background:#fff8ef;margin:14px 0}.small-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.role-badge{display:inline-block;padding:7px 11px;border-radius:999px;background:#3b3028;color:white;font-size:12px;font-weight:900}.resident-badge{background:#8b6c52}.admin-badge{background:#7e3f35}@media(max-width:560px){.fields,.admin-grid,.small-actions{grid-template-columns:1fr}.card{padding:20px}h1{font-size:25px}}
</style></head><body><main class="wrap"><div class="top"><b>스테이The머무름</b><a href="resident-event.html" id="logout">관리자 종료</a></div><section class="card"><span class="role-badge admin-badge">관리자 전용 화면</span><h1>🔐 입실자 이벤트 관리자</h1><p class="desc">응모 현황과 마감시간을 관리하고, 마감 후 2명의 당첨자를 룰렛으로 추첨합니다.</p><div class="admin-grid"><div class="stat">현재 응모 인원<b id="participantCount">0명</b></div><div class="stat">당첨 인원<b>2명</b></div></div><div class="fields"><label>응모 시작<input id="startAt" type="datetime-local"></label><label>응모 마감<input id="endAt" type="datetime-local"></label></div><button id="saveTime" class="secondary">응모 시간 저장</button><h3>응모 호실</h3><div id="participants" class="participant-list"></div><div class="fields"><input id="manualRoom" inputmode="numeric" placeholder="호실 수동 추가"><button id="addRoom" class="secondary">호실 추가</button></div><div class="small-actions"><button id="exportRooms" class="secondary">명단 복사</button><button id="closeEvent" class="secondary">지금 마감</button><button id="resetEvent" class="danger">응모 초기화</button></div></section><section class="card"><h2>🎡 관리자 추첨</h2><p class="desc">응모자를 확인한 뒤 추첨을 시작하세요. 같은 호실이 두 번 당첨되지 않습니다.</p><div class="wheel-wrap"><div class="pointer"></div><div id="wheel" class="wheel"><span id="wheelText">행운의 룰렛</span></div></div><button id="spin">2명 추첨 START</button><div id="winnerBox"></div></section></main><script>
(function(){if(sessionStorage.getItem('stayEventAdmin')!=='1'){location.replace('resident-event.html');return}const PREFIX='stayResidentEvent:movie-ticket-202608:';const DEF={start:'2026-08-26T00:00',end:'2026-08-31T20:00',closed:false};const $=id=>document.getElementById(id);$('logout').onclick=function(){sessionStorage.removeItem('stayEventAdmin')};function list(){try{return JSON.parse(localStorage.getItem(PREFIX+'participants')||'[]')}catch(e){return []}}function setList(v){localStorage.setItem(PREFIX+'participants',JSON.stringify(v))}function cfg(){try{return JSON.parse(localStorage.getItem(PREFIX+'config'))||{...DEF}}catch(e){return {...DEF}}}function setCfg(v){localStorage.setItem(PREFIX+'config',JSON.stringify(v));render()}function render(){const a=list(),c=cfg();$('participantCount').textContent=a.length+'명';$('participants').innerHTML=a.length?a.map(r=>'<span class="chip">'+r+'호</span>').join(''):'<span class="notice">아직 응모자가 없습니다.</span>';$('startAt').value=c.start;$('endAt').value=c.end}$('saveTime').onclick=function(){const s=$('startAt').value,e=$('endAt').value;if(!s||!e||new Date(s)>=new Date(e)){alert('시작·마감 시간을 확인해 주세요.');return}setCfg({start:s,end:e,closed:false});alert('응모 시간이 저장되었습니다.')};$('addRoom').onclick=function(){const r=$('manualRoom').value.trim();if(!/^\d{2,4}$/.test(r)){alert('호실을 숫자로 입력해 주세요.');return}let a=list();if(!a.includes(r)){a.push(r);setList(a)}$('manualRoom').value='';render()};$('closeEvent').onclick=function(){const c=cfg();c.closed=true;setCfg(c);alert('응모를 마감했습니다.')};$('resetEvent').onclick=function(){if(confirm('응모자와 당첨 결과를 모두 초기화할까요?')){localStorage.removeItem(PREFIX+'participants');localStorage.removeItem(PREFIX+'winners');const c=cfg();c.closed=false;setCfg(c);$('winnerBox').innerHTML='';render()}};$('exportRooms').onclick=async function(){const t=list().map(r=>r+'호').join(', ');try{await navigator.clipboard.writeText(t||'응모자 없음');alert('응모 명단을 복사했습니다.')}catch(e){prompt('응모 명단',t)}};function spinRound(winner,round,done){const wheel=$('wheel'),text=$('wheelText');text.textContent=round+'차 추첨 중...';wheel.style.transition='none';wheel.style.transform='rotate(0deg)';void wheel.offsetWidth;const deg=1800+Math.floor(Math.random()*1080);wheel.style.transition='transform 4.5s cubic-bezier(.12,.68,.08,1)';wheel.style.transform='rotate('+deg+'deg)';setTimeout(function(){text.textContent=winner+'호';done()},4550)}$('spin').onclick=function(){let a=list();if(a.length<2){alert('2명을 추첨하려면 응모자가 최소 2명 필요합니다.');return}const pool=[...a],first=pool.splice(Math.floor(Math.random()*pool.length),1)[0],second=pool[Math.floor(Math.random()*pool.length)],w=[first,second];$('spin').disabled=true;$('winnerBox').innerHTML='<div class="info">🎡 1차 당첨자를 추첨하고 있습니다...</div>';spinRound(first,1,function(){$('winnerBox').innerHTML='<div class="winner">🎉 1차 당첨: '+first+'호</div><div class="info">잠시 후 2차 추첨을 시작합니다.</div>';setTimeout(function(){spinRound(second,2,function(){localStorage.setItem(PREFIX+'winners',JSON.stringify(w));$('winnerBox').innerHTML='<div class="winner">🎉 당첨을 축하합니다!<br>1차 '+first+'호 · 2차 '+second+'호</div>';$('spin').disabled=false})},900)})};try{const w=JSON.parse(localStorage.getItem(PREFIX+'winners')||'[]');if(w.length)$('winnerBox').innerHTML='<div class="winner">🎉 최근 당첨: '+w.map(r=>r+'호').join(' · ')+'</div>'}catch(e){}render()})();
</script></body></html>

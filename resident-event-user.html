<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>입실자 이벤트 참여 | 스테이The머무름</title><meta name="robots" content="noindex,nofollow"><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",Arial,sans-serif;background:#f7f3ee;color:#28231f}.wrap{max-width:820px;margin:auto;padding:24px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top a{color:#5b5149;text-decoration:none}.card{background:#fff;border-radius:22px;padding:26px;box-shadow:0 8px 28px #00000010;margin-bottom:16px}.hero{text-align:center;background:linear-gradient(145deg,#fff,#f4e9dc)}h1{font-size:29px;margin:8px 0}h2{margin-top:0}.gift{font-size:62px;margin:10px}.desc{color:#6b625b;line-height:1.65}button{width:100%;border-radius:13px;padding:14px;font-size:16px;border:0;background:#3b3028;color:#fff;font-weight:800;cursor:pointer}.notice{font-size:13px;color:#766c64;line-height:1.6}.test{display:inline-block;padding:5px 9px;border-radius:999px;background:#f1e9df;color:#725d4b;font-size:12px;font-weight:800}.ok{padding:14px;border-radius:13px;background:#eef7ed;color:#315b31;margin-top:12px}.bad{padding:14px;border-radius:13px;background:#fff0ee;color:#8b3b32;margin-top:12px}.ticket{border:2px dashed #c8a27c;border-radius:18px;padding:20px;margin:18px 0;background:#fffaf4}.ticket strong{font-size:22px}.countdown{font-size:18px;font-weight:900;margin:12px 0;color:#815f43}@media(max-width:560px){.card{padding:20px}h1{font-size:25px}}
</style></head><body><main class="wrap"><div class="top"><b>스테이The머무름</b><a href="resident-event.html">나가기</a></div><section class="card hero"><span class="test">현재는 테스트 화면입니다</span><div class="gift">🎬</div><h1>영화관람권 이벤트</h1><p class="desc"><b id="identity"></b>로 인증되었습니다.<br>영화관람권 1매씩, 총 2명을 공개 사다리 방식으로 추첨합니다.</p><div class="ticket"><strong>🎟️ 영화관람권 1매</strong><br>당첨 인원 2명<div id="countdown" class="countdown"></div></div><button id="apply">추첨에 참여하기</button><div id="msg"></div><p class="notice">한 호실당 한 번만 응모할 수 있습니다. 마감 후 공개 추첨 화면에서 응모자와 사다리 경로, 당첨 결과를 확인할 수 있습니다.</p></section><section class="card"><h2>공개 추첨 안내</h2><p class="desc">응모 마감 후 관리자가 공개 추첨 링크를 공지합니다. 링크에서는 전체 사다리와 각 경로가 실제로 움직이는 과정을 다시 확인할 수 있습니다.</p></section></main><script>
(function(){const PREFIX='stayResidentEvent:movie-ticket-202608:';const room=sessionStorage.getItem('stayEventRoom'),name=sessionStorage.getItem('stayEventName');if(!room||!name){location.replace('resident-event.html');return}const $=id=>document.getElementById(id);$('identity').textContent=room+'호 '+name;function participants(){try{const a=JSON.parse(localStorage.getItem(PREFIX+'participants')||'[]');return a.map(x=>typeof x==='string'?{room:x,name:''}:x)}catch(e){return []}}function setParticipants(v){localStorage.setItem(PREFIX+'participants',JSON.stringify(v))}function config(){try{return JSON.parse(localStorage.getItem(PREFIX+'config'))||{start:'2026-08-26T00:00',end:'2026-08-31T20:00',closed:false}}catch(e){return {start:'2026-08-26T00:00',end:'2026-08-31T20:00',closed:false}}}function open(){const c=config(),n=new Date();return !c.closed&&n>=new Date(c.start)&&n<=new Date(c.end)}function countdown(){const c=config(),n=new Date(),s=new Date(c.start),e=new Date(c.end),el=$('countdown');if(c.closed||n>e){el.textContent='응모 마감';return}if(n<s){el.textContent='응모 시작 전';return}const d=e-n,dd=Math.floor(d/86400000),h=Math.floor(d%86400000/3600000),m=Math.floor(d%3600000/60000);el.textContent='마감까지 '+(dd?dd+'일 ':'')+h+'시간 '+m+'분'}$('apply').onclick=function(){if(!open()){$('msg').innerHTML='<div class="bad">현재는 응모 가능한 시간이 아닙니다.</div>';return}let list=participants();if(list.some(x=>x.room===room)){$('msg').innerHTML='<div class="bad">'+room+'호는 이미 응모했습니다.</div>';return}list.push({room,name});setParticipants(list);$('msg').innerHTML='<div class="ok">🎉 '+room+'호 '+name+'님 응모가 완료되었습니다.</div>'};countdown();setInterval(countdown,60000)})();
</script></body></html>

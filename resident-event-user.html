<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>입실자 이벤트 참여 | 스테이The머무름</title><meta name="robots" content="noindex,nofollow"><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",Arial,sans-serif;background:#f7f3ee;color:#28231f}.wrap{max-width:820px;margin:auto;padding:24px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top a{color:#5b5149;text-decoration:none}.card{background:#fff;border-radius:22px;padding:26px;box-shadow:0 8px 28px #00000010;margin-bottom:16px}.hero{text-align:center;background:linear-gradient(145deg,#fff,#f4e9dc)}h1{font-size:29px;margin:8px 0}h2{margin-top:0}.gift{font-size:62px;margin:10px}.desc{color:#6b625b;line-height:1.65}button{width:100%;border-radius:13px;padding:14px;font-size:16px;border:0;background:#3b3028;color:#fff;font-weight:800;cursor:pointer}button:disabled{opacity:.45}.notice{font-size:13px;color:#766c64;line-height:1.6}.ok{padding:14px;border-radius:13px;background:#eef7ed;color:#315b31;margin-top:12px}.bad,.status{padding:14px;border-radius:13px;margin-top:12px}.bad{background:#fff0ee;color:#8b3b32}.status{background:#fff4df;color:#6d4c25;font-weight:800;line-height:1.6}.ticket{border:2px dashed #c8a27c;border-radius:18px;padding:20px;margin:18px 0;background:#fffaf4}.ticket strong{font-size:22px}.countdown{font-size:18px;font-weight:900;margin:12px 0;color:#815f43}@media(max-width:560px){.card{padding:20px}h1{font-size:25px}}
</style><script>document.write('<script src="resident-event-config.js?v='+Date.now()+'"><\/script>')</script><script>document.write('<script src="resident-event-api.js?v='+Date.now()+'"><\/script>')</script></head><body><main class="wrap"><div class="top"><b>스테이The머무름</b><a href="resident-event.html">나가기</a></div><section class="card hero"><div class="gift">🎁</div><h1 id="title">입실자 이벤트</h1><p class="desc"><b id="identity"></b>로 인증되었습니다.</p><p id="status" class="status"></p><div class="ticket"><strong id="prize">이벤트 상품</strong><br><span id="count"></span><div id="countdown" class="countdown"></div></div><div id="publicCount" class="ticket" style="margin:12px 0;padding:14px"><b>현재 서버 응모 인원</b><div id="publicCountValue" style="font-size:25px;font-weight:900;margin-top:6px">확인 중...</div><button id="refreshCount" class="secondary" style="margin-top:8px;background:#eee7e0;color:#3b3028">🔄 인원 새로고침</button></div><button id="apply">추첨에 참여하기</button><button id="viewResult" style="margin-top:10px;background:#7a5a3e">🎉 추첨 결과 보기</button><div id="msg"></div><section style="text-align:left;margin-top:20px;padding:16px;background:#fff;border-radius:14px"><h2 style="font-size:19px;margin:0 0 8px">🔎 내 응모 기록 확인</h2><p class="notice">응모할 때 입력한 비밀번호·이름·방번호가 모두 일치해야 서버 접수 기록을 확인할 수 있습니다.</p><input id="verifyPass" type="password" inputmode="numeric" autocomplete="off" placeholder="입실자 비밀번호" style="width:100%;padding:12px;margin-bottom:7px;border:1px solid #ddd;border-radius:10px"><input id="verifyName" autocomplete="off" placeholder="응모 당시 이름" style="width:100%;padding:12px;margin-bottom:7px;border:1px solid #ddd;border-radius:10px"><input id="verifyRoom" inputmode="numeric" autocomplete="off" placeholder="응모 당시 방번호" style="width:100%;padding:12px;margin-bottom:7px;border:1px solid #ddd;border-radius:10px"><button id="verifyMine">내 응모 기록 확인하기</button><div id="verifyMessage" aria-live="polite"></div></section><p class="notice"><b>응모 인원 수에는 제한이 없습니다.</b> 단, 한 호실당 한 번만 응모할 수 있습니다.</p><div style="margin-top:14px;padding:14px;border-radius:14px;background:#fff4df;color:#6d4c25;font-size:14px;font-weight:800;line-height:1.65">📢 응모 마감 후 이 페이지의 <b>추첨 결과 보기</b>에서 결과를 직접 확인해 주세요.</div></section></main><script>
(async function(){
  try {
    const server = await StayEventApi.getPublicConfig();
    if (!server.config) throw Error('현재 서버에 공개 이벤트 설정이 없습니다.');
    window.STAY_EVENT_PUBLIC_CONFIG = server.config;
  } catch (error) {
    document.body.innerHTML = '<main style="max-width:650px;margin:48px auto;padding:24px;font-family:sans-serif"><h2>이벤트 정보를 불러오지 못했습니다.</h2><p>잘못된 이벤트로 응모하지 않도록 화면을 중단했습니다. 잠시 후 새로고침해 주세요.</p><a href="index.html">홈으로 돌아가기</a></main>';
    return;
  }
(function(){
  const RESIDENT_PASS='2026', PREFIX='stayResidentEvent:'+((window.STAY_EVENT_PUBLIC_CONFIG||{}).eventId||'unknown')+':';
  const C=Object.assign({active:false,eventId:'movie-ticket-202608',eventTitle:'입실자 이벤트',prizeLabel:'이벤트 상품',prizeCount:2,start:'',end:'',activeMessage:'현재 이벤트가 진행 중입니다.',inactiveMessage:'현재 진행 중인 입실자 이벤트가 없습니다.',closedMessage:'응모가 마감되었습니다.',resultFile:'resident-event-result.html'},window.STAY_EVENT_PUBLIC_CONFIG||{});
  const room=sessionStorage.getItem('stayEventRoom'),name=sessionStorage.getItem('stayEventName')||'';
  if(!room){location.replace('resident-event.html');return}
  let device=null;try{device=JSON.parse(localStorage.getItem(PREFIX+'deviceIdentity')||'null')}catch(e){}
  if(!device||device.room!==room){location.replace('resident-event.html');return}const residentName=(name||device.name||'').trim();if(!residentName){location.replace('resident-event.html');return}
  const $=id=>document.getElementById(id);
  $('identity').textContent=residentName+'님 · '+room+'호';$('title').textContent=C.eventTitle;$('prize').textContent=C.prizeLabel;$('count').textContent='당첨 인원 '+C.prizeCount+'명';
  function state(){const status=C.status||(C.active?'active':'inactive');if(status==='preparing')return 'preparing';if(status==='testing')return 'testing';const n=new Date(),s=C.start?new Date(C.start):null,e=C.end?new Date(C.end):null;if(status!=='active')return 'inactive';if(s&&n<s)return 'before';if(e&&n>e)return 'closed';return 'open'}
  function render(){const st=state(),s=$('status'),cd=$('countdown'),b=$('apply');if(st==='preparing'){s.textContent='이벤트 준비 중입니다.';cd.textContent='';b.disabled=true;b.style.display='none'}else if(st==='testing'){s.textContent='이벤트 테스트 중입니다. 테스트 응모가 가능합니다.';cd.textContent='테스트 모드';b.disabled=false;b.style.display='block'}else if(st==='inactive'){s.textContent=C.inactiveMessage;cd.textContent='';b.disabled=true;b.style.display='none'}else if(st==='before'){s.textContent=C.activeMessage;cd.textContent='응모 시작 전';b.disabled=true;b.style.display='block'}else if(st==='closed'){s.textContent=C.closedMessage;cd.textContent='응모 마감';b.disabled=true;b.style.display='none'}else{s.textContent=C.activeMessage;const d=new Date(C.end)-new Date(),dd=Math.floor(d/86400000),h=Math.floor(d%86400000/3600000),m=Math.floor(d%3600000/60000);cd.textContent='마감까지 '+(dd?dd+'일 ':'')+h+'시간 '+m+'분';b.disabled=false;b.style.display='block'}}
  $('viewResult').onclick=()=>location.href=(C.resultFile||'resident-event-result.html')+'?v='+Date.now();
  $('apply').onclick=async function(){
    if(!['open','testing'].includes(state())){$('msg').innerHTML='<div class="bad">현재는 응모 가능한 시간이 아닙니다.</div>';return}
    if(!window.StayEventApi||!StayEventApi.configured()){$('msg').innerHTML='<div class="bad">응모 서버 연결 설정이 아직 완료되지 않았습니다. 원장님께 문의해 주세요.</div>';return}
    const b=$('apply');b.disabled=true;b.textContent='응모 확인 중...';
    try{
      const eventId=C.eventId||'movie-ticket-202608';
      const data=await StayEventApi.apply(eventId,room,residentName,RESIDENT_PASS);
      // 새 서버는 저장 직후 실제 저장 여부를 다시 조회합니다. 구버전 서버는 check 액션을 모를 수 있어 응모 자체는 그대로 유지됩니다.
      let verified=false, checkUnavailable=false;
      if(StayEventApi.check){
        try{
          await new Promise(function(resolve){setTimeout(resolve,350)});
          const checked=await StayEventApi.check(eventId,room,residentName,RESIDENT_PASS);
          verified=checked.applied===true && checked.nameMatches===true && checked.participant && String(checked.participant.room)===String(room) && checked.participant.name===residentName;
        }catch(checkErr){checkUnavailable=true}
      }
      if(data.accepted){
        if(verified){$('msg').innerHTML='<div class="ok">✅ 서버 저장까지 확인했습니다.<br>🎉 '+residentName+'님 · '+room+'호 응모가 완료되었습니다.</div>';b.textContent='응모 완료 · 저장 확인';b.disabled=true}
        else if(checkUnavailable){$('msg').innerHTML='<div class="bad">🎉 '+residentName+'님 · '+room+'호 응모 요청이 접수되었습니다.<br><span style="font-size:13px">※ 현재 서버가 구버전이라 저장 재확인 기능은 사용할 수 없습니다.</span></div>';b.textContent='저장 확인 필요';b.disabled=false}
        else{$('msg').innerHTML='<div class="bad">응모 요청은 처리됐지만 서버 저장 확인이 되지 않았습니다.<br>원장님께 알려 주세요.</div>';b.textContent='저장 확인 필요';b.disabled=false}
      }else{
        if(verified){$('msg').innerHTML='<div class="ok">✅ '+residentName+'님 · '+room+'호는 이미 서버에 정상 응모되어 있습니다.</div>';b.textContent='응모 완료 · 저장 확인';b.disabled=true}
        else{$('msg').innerHTML='<div class="bad">'+(data.message||room+'호는 이미 응모했거나 응모할 수 없습니다.')+'</div>';b.textContent='응모 확인 필요';b.disabled=false}
      }
    }catch(err){$('msg').innerHTML='<div class="bad">응모 서버 연결에 실패했습니다.<br>'+String(err.message||err)+'</div>';b.textContent='다시 시도하기';b.disabled=false}
  };
  async function updateCount(){try{const x=await StayEventApi.count(C.eventId);$('publicCountValue').textContent=x.total+'명';}catch(e){$('publicCountValue').textContent='조회 실패 · 다시 시도해 주세요';}}
  $('refreshCount').onclick=updateCount;
  $('verifyMine').onclick=async function(){const b=this;b.disabled=true;const out=$('verifyMessage');out.textContent='서버에서 확인 중...';try{const x=await StayEventApi.verifyMine(C.eventId,$('verifyRoom').value.trim(),$('verifyName').value.trim(),$('verifyPass').value.trim());if(x.verified){const t=x.participant;out.innerHTML='<div class="ok">✅ 서버 접수 기록이 확인되었습니다.<br>'+t.room+'호 · '+t.name+'<br>접수번호: '+t.receiptId+'<br>접수시각: '+new Date(t.createdAt).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})+'</div>';}else{out.innerHTML='<div class="bad">입력하신 정보와 일치하는 서버 응모 기록이 없습니다. 응모 정보 또는 접수 상태를 확인해 주세요.</div>';}}catch(e){out.innerHTML='<div class="bad">조회 실패: 서버 연결 또는 입력 정보를 확인해 주세요.</div>';}finally{b.disabled=false;}};
  render();updateCount();setInterval(function(){render();updateCount()},60000);
})();
})();
</script></body></html>

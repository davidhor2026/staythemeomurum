*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",Arial,sans-serif;background:#f7f3ee;color:#28231f}.wrap{max-width:820px;margin:auto;padding:24px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top a{color:#5b5149;text-decoration:none}.card{background:#fff;border-radius:22px;padding:26px;box-shadow:0 8px 28px #00000010;margin-bottom:16px}.eyebrow{font-size:13px;font-weight:800;color:#8b6c52}.hero{text-align:center;background:linear-gradient(145deg,#fff,#f4e9dc)}h1{font-size:29px;margin:8px 0}h2{margin-top:0}.gift{font-size:62px;margin:10px}.desc{color:#6b625b;line-height:1.65}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.fields.one{grid-template-columns:1fr}input,select,button{width:100%;border-radius:13px;padding:14px;font-size:16px}input,select{border:1px solid #d9d0c7;background:#fff}button{border:0;background:#3b3028;color:#fff;font-weight:800;cursor:pointer}.secondary{background:#eee7e0;color:#3b3028}.danger{background:#8b3b32}.hidden{display:none!important}.notice{font-size:13px;color:#766c64;line-height:1.6}.ok{padding:14px;border-radius:13px;background:#eef7ed;color:#315b31;margin-top:12px}.bad{padding:14px;border-radius:13px;background:#fff0ee;color:#8b3b32;margin-top:12px}.info{padding:14px;border-radius:13px;background:#f3efe9;color:#65594f;margin-top:12px}.ticket{border:2px dashed #c8a27c;border-radius:18px;padding:20px;margin:18px 0;background:#fffaf4}.ticket strong{font-size:22px}.countdown{font-size:18px;font-weight:900;margin:12px 0;color:#815f43}.wheel-wrap{position:relative;width:min(360px,84vw);margin:24px auto}.pointer{position:absolute;z-index:4;top:-9px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid #3b3028}.wheel{width:100%;aspect-ratio:1;border-radius:50%;background:repeating-conic-gradient(#e7c7a5 0 24deg,#fff0dc 24deg 48deg);border:10px solid #fff;box-shadow:0 8px 25px #0002;display:grid;place-items:center;transition:transform 4.5s cubic-bezier(.12,.68,.08,1);position:relative;overflow:hidden}.wheel::after{content:"";width:38%;aspect-ratio:1;border-radius:50%;background:white;box-shadow:0 2px 10px #0002;position:absolute}.wheel span{z-index:2;font-weight:900;text-align:center;padding:12px;max-width:150px}.participant-list{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{padding:8px 11px;border-radius:999px;background:#f1e9df;font-weight:800}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:16px;border-radius:15px;background:#faf6f1}.stat b{display:block;font-size:26px;margin-top:4px}.winner{font-size:25px;font-weight:900;text-align:center;padding:20px;border:2px solid #d4b18b;border-radius:18px;background:#fff8ef;margin:14px 0}.small-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.role-badge{display:inline-block;padding:7px 11px;border-radius:999px;background:#3b3028;color:white;font-size:12px;font-weight:900}.resident-badge{background:#8b6c52}.admin-badge{background:#7e3f35}@media(max-width:560px){.fields,.admin-grid,.small-actions{grid-template-columns:1fr}.card{padding:20px}h1{font-size:25px}}
</style></head><body><main class="wrap"><div class="top"><b>스테이The머무름</b><a href="resident-event.html">나가기</a></div><section class="card hero"><span class="role-badge resident-badge">입실자 참여 화면</span><div class="gift">🎬</div><h1>영화관람권 이벤트</h1><p class="desc"><b id="roomLabel"></b>로 인증되었습니다.<br>영화관람권 1매씩, 총 2명을 추첨합니다.</p><div class="ticket"><strong>🎟️ 영화관람권 1매</strong><br>당첨 인원 2명<div id="countdown" class="countdown"></div></div><button id="apply">추첨에 참여하기</button><div id="msg"></div><p class="notice">한 호실당 한 번만 응모할 수 있습니다. 당첨 결과는 호실로만 공개됩니다.</p></section><section class="card"><h2>참여 안내</h2><p class="desc">응모 마감 후 관리자가 추첨을 진행합니다. 추첨이 끝나면 공지된 방식으로 당첨 결과를 확인해 주세요.</p></section></main><script>
(function(){const PREFIX='stayResidentEvent:movie-ticket-202608:';const room=sessionStorage.getItem('stayEventRoom');if(!room){location.replace('resident-event.html');return}const $=id=>document.getElementById(id);$('roomLabel').textContent=room+'호';function participants(){try{return JSON.parse(localStorage.getItem(PREFIX+'participants')||'[]')}catch(e){return []}}function setParticipants(v){localStorage.setItem(PREFIX+'participants',JSON.stringify(v))}function config(){try{return JSON.parse(localStorage.getItem(PREFIX+'config'))||{start:'2026-08-26T00:00',end:'2026-08-31T20:00',closed:false}}catch(e){return {start:'2026-08-26T00:00',end:'2026-08-31T20:00',closed:false}}}function open(){const c=config(),n=new Date();return !c.closed&&n>=new Date(c.start)&&n<=new Date(c.end)}function countdown(){const c=config(),n=new Date(),s=new Date(c.start),e=new Date(c.end),el=$('countdown');if(c.closed||n>e){el.textContent='응모 마감';return}if(n<s){el.textContent='응모 시작 전';return}const d=e-n,dd=Math.floor(d/86400000),h=Math.floor(d%86400000/3600000),m=Math.floor(d%3600000/60000);el.textContent='마감까지 '+(dd?dd+'일 ':'')+h+'시간 '+m+'분'}$('apply').onclick=function(){if(!open()){$('msg').innerHTML='<div class="bad">현재는 응모 가능한 시간이 아닙니다.</div>';return}let list=participants();if(list.includes(room)){$('msg').innerHTML='<div class="bad">'+room+'호는 이미 응모했습니다.</div>';return}list.push(room);setParticipants(list);$('msg').innerHTML='<div class="ok">🎉 '+room+'호 응모가 완료되었습니다.</div>'};countdown();setInterval(countdown,60000)})();
</script></body></html>
